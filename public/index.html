<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GuionVisual — del guión al storyboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">🎬</span>
        <div>
          <h1>GuionVisual</h1>
          <p>Del guión a un storyboard de imágenes sincronizadas</p>
        </div>
      </div>
      <div id="mode-badge" class="badge" title="Fuente de imágenes">…</div>
    </header>

    <main>
      <!-- Panel de entrada -->
      <section class="panel input-panel">
        <label for="script" class="field-label">Tu guión</label>
        <textarea
          id="script"
          placeholder="Pega aquí tu guión. Cada frase y cada pausa se convertirá en una o varias imágenes…"
          spellcheck="false"
        ></textarea>

        <div class="controls">
          <div class="control">
            <label for="wpm">Velocidad (palabras/min)</label>
            <input type="number" id="wpm" min="60" max="300" step="5" value="150" />
          </div>
          <div class="control">
            <label for="maxSec">Máx. seg. por imagen</label>
            <input type="number" id="maxSec" min="1" max="10" step="0.5" value="3.5" />
          </div>
          <div class="control">
            <label for="mediaType">Tipo de stock</label>
            <select id="mediaType">
              <option value="photo">Fotos</option>
              <option value="video">Vídeos</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button id="analyze" class="btn primary">Analizar guión</button>
          <button id="load-example" class="btn ghost">Cargar ejemplo</button>
        </div>

        <div id="stats" class="stats" hidden></div>
      </section>

      <!-- Storyboard -->
      <section class="panel board-panel">
        <div class="board-header">
          <h2>Storyboard</h2>
          <div class="export-actions" id="export-actions" hidden>
            <button id="export-json" class="btn ghost sm">Exportar JSON</button>
            <button id="export-csv" class="btn ghost sm">Exportar CSV</button>
          </div>
        </div>
        <div id="board" class="board">
          <p class="empty">Escribe o pega un guión y pulsa <strong>Analizar guión</strong>.</p>
        </div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
