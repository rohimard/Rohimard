# Deja en la rama lo que haya en salida/. Se extrae a una accion porque el
# bucle de reintentos se repetia en cinco workflows y cuando dos trabajos
# empujan a la vez uno pierde: aqui el reintento esta en un solo sitio.
name: devolver
description: Commitea y empuja los archivos de salida a la rama actual
inputs:
  destino:
    description: Carpeta del repo donde dejarlos
    required: true
  mensaje:
    description: Mensaje del commit
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        mkdir -p "${{ inputs.destino }}"
        # Si el paso anterior corto por cupo antes de montar el mp3 final,
        # salida/ queda vacia: el glob no expande, mv falla contra el
        # literal "salida/*" y con `set -e` tira todo el resto del script,
        # incluido el commit de lo que YA se guardo (por ejemplo, trozos
        # sueltos que otro paso ya copio al destino). Que no haya mp3 final
        # no es motivo para perder eso.
        mv salida/* "${{ inputs.destino }}"/ 2>/dev/null || true
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -f "${{ inputs.destino }}"
        git commit -q -m "${{ inputs.mensaje }}" || exit 0
        # Diez intentos con espera creciente: varios trabajos de la misma
        # matriz terminan a la vez y chocan al empujar.
        for i in $(seq 1 10); do
          git pull --rebase -q origin "$GITHUB_REF_NAME" && \
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
          sleep $((i * 4))
        done
        exit 1
