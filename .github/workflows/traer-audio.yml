# Baja audios generados por servicios externos y los deja en la rama.
#
# Existe porque la salida de red del entorno donde trabaja Claude bloquea
# varios dominios de alojamiento (Fish Audio entre ellos: 403 en el tunel).
# El runner si tiene salida libre, asi que hace de puente en vez de forzar
# una politica que no me toca saltarme.
#
# La lista va en <carpeta>/.urls, una linea por archivo: "nombre url".
name: traer-audio

on:
  workflow_dispatch:
  push:
    branches:
      - claude/viral-youtube-video-ideas-luqj2m
    paths:
      - canal-youtube/muestras-voz/**/.urls

permissions:
  contents: write

jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Bajar
        run: |
          set -u
          for lista in $(find canal-youtube/muestras-voz -name .urls); do
            carpeta=$(dirname "$lista")
            while read -r nombre url; do
              [ -z "${nombre:-}" ] && continue
              echo "-> $nombre"
              curl -sSL --max-time 180 -o "$carpeta/$nombre.mp3" "$url"
              # Un 403 o una pagina de error tambien se guardan como archivo:
              # hay que comprobar que lo bajado es audio de verdad.
              if ! ffprobe -v error -show_entries format=duration \
                   -of csv=p=0 "$carpeta/$nombre.mp3" > /dev/null 2>&1; then
                echo "::error::$nombre no es audio valido"
                head -c 200 "$carpeta/$nombre.mp3"
                rm -f "$carpeta/$nombre.mp3"
                exit 1
              fi
              echo "   $(ffprobe -v error -show_entries format=duration -of csv=p=0 "$carpeta/$nombre.mp3")s"
            done < "$lista"
          done

      - name: Devolver a la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f canal-youtube/muestras-voz
          git commit -q -m 'Audios traidos de servicios externos' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && \
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
