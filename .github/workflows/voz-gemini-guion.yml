# Narra el GUION ENTERO con Gemini TTS, POR TROZOS.
#
# LO QUE SE APRENDIO A LA MALA
# La primera version pedia los 287 segundos en una sola peticion. Cabian: el
# audio volvia entero y la transcripcion del final coincidia con el guion.
# Pero la voz se DEGRADA segun avanza, y eso no lo ve un ffprobe:
#
#   t=10s   agudos -6,7 dB   graves -1,3 dB   eco a 150 ms +0,19
#   t=275s  agudos -3,6 dB   graves -3,4 dB   eco a 150 ms +0,33
#
# Es decir: pierde cuerpo, gana siseo, y hacia el final aparece una repeticion
# a 150 ms que se oye como eco. El transcriptor de Fish llego a escribir
# "[eco]" en mitad del texto. El quiebre esta entre el segundo 60 y el 120.
#
# Causa: el modelo es autorregresivo, cada tramo se genera condicionado por lo
# que el mismo acaba de producir, y el error se acumula. La cura no es cambiar
# de voz sino no dejarle correr tanto seguido.
#
# POR ESO SE TROCEA
# Trozos de unas 160 palabras (~60 s), cortados SOLO en final de frase, una
# peticion por trozo. Cinco peticiones de las diez diarias gratuitas para un
# video entero: sigue saliendo gratis, y sin degradacion.
#
# Los trozos se igualan en nivel antes de pegarlos (si no, se oye el salto en
# cada costura) y se comprueba que la duracion total se parece al patron.
#
# SE PUEDE REANUDAR, Y HACE FALTA
# El cupo diario NO se reinicia a medianoche UTC sino a medianoche del
# Pacifico. La primera tanda troceada murio en el trozo 2 por cuota, con el
# trozo 1 ya generado y tirado a la basura. Ahora cada trozo se guarda en la
# rama segun sale, con el hash de su texto al lado; al relanzar se reutiliza
# lo que ya existe y solo se piden los que faltan. Si cambia el guion, el
# hash deja de cuadrar y ese trozo se regenera solo.
name: voz-gemini-guion

# workflow_dispatch no sirve aqui: la API solo lo acepta si el workflow esta
# en la rama por defecto, y este vive en la rama de trabajo. Asi que se
# dispara tocando un fichero centinela, igual que voz-guion-completo.
#
# El disparador es .gemini-disparo y NO el propio workflow, a proposito:
# corregir una linea de codigo no debe gastar una de las diez peticiones
# diarias. Eso ya paso dos veces.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/viral-youtube-video-ideas-luqj2m
    paths:
      - canal-youtube/.gemini-disparo

permissions:
  contents: write

env:
  GUION: canal-youtube/producciones/07-reina-victoria-duelo/guion-voz.txt
  DESTINO: canal-youtube/muestras-voz/gemini-guion
  MODELO: gemini-2.5-flash-preview-tts
  # Achird es "Friendly" en el catalogo de Google, la mas cercana al perfil
  # Kevin que pidio el usuario. Si se cambia la voz, cambia tambien CLAVE.
  VOZ: Achird
  CLAVE: achird-guion-completo
  # La duracion de la narracion de Azure ya montada, en segundos. Sirve de
  # patron: si Gemini devuelve mucho menos, es que trunco.
  ESPERADO: '298.3'
  # Palabras por trozo. 160 son unos 57 s a 2,8 palabras/s, por debajo
  # del minuto en que empieza a degradarse.
  PALABRAS: '160'
  DIRECCION: >-
    Habla en español latinoamericano neutro. Eres un hombre de unos cuarenta y
    cinco años contandole esto a un amigo sentado enfrente, sin prisa y sin
    publico. Registro medio, volumen de conversacion. No eres locutor: no
    proyectes la voz, no subrayes palabras, no hagas la entonacion cantada de
    la radio. Baja el tono al final de cada frase, nunca lo subas. Respira
    donde respirarias hablando de verdad y para en los puntos antes de seguir.
    Manten el mismo tono de principio a fin, sin acelerar segun avanzas. No
    dramatices: el dato ya incomoda solo.

jobs:
  narrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/viral-youtube-video-ideas-luqj2m

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Resolver la clave de Google
        env:
          CLAVE_OK: ${{ secrets.GOOGLE_API_KEY }}
          CLAVE_TYPO: ${{ secrets.GOOGLE_API_JEY }}
        run: |
          G="${CLAVE_OK:-$CLAVE_TYPO}"
          if [ -z "$G" ]; then
            echo "::error::no hay clave de Google en los secretos del repo"
            exit 1
          fi
          echo "::add-mask::$G"
          echo "GOOGLE=$G" >> "$GITHUB_ENV"

      - name: Sintetizar por trozos
        run: |
          mkdir -p salida trozos
          # Recuperar los trozos que ya se generaron en tandas anteriores.
          cp -f "$DESTINO"/trozos/*.flac trozos/ 2>/dev/null || true
          cp -f "$DESTINO"/trozos/manifiesto.json trozos/ 2>/dev/null || true
          python3 - <<'PY'
          import base64, hashlib, json, math, os, re, subprocess, sys, time
          import urllib.error, urllib.request, wave, array

          texto = open(os.environ["GUION"], encoding="utf-8").read().strip()
          direccion = " ".join(os.environ["DIRECCION"].split())
          tope = int(os.environ["PALABRAS"])

          # Cortar SOLO en final de frase: partir a mitad deja el trozo
          # siguiente empezando sin entonacion de arranque, y se nota.
          frases = re.findall(r"[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$", texto)
          frases = [f.strip() for f in frases if f.strip()]
          trozos, actual = [], []
          for f in frases:
              actual.append(f)
              if sum(len(x.split()) for x in actual) >= tope:
                  trozos.append(" ".join(actual)); actual = []
          if actual:
              # Una cola muy corta se pega al trozo anterior en vez de gastar
              # una peticion entera en diez palabras.
              if trozos and sum(len(x.split()) for x in actual) < tope // 3:
                  trozos[-1] += " " + " ".join(actual)
              else:
                  trozos.append(" ".join(actual))

          print(f"{len(texto.split())} palabras -> {len(trozos)} trozos")
          if len(trozos) > 10:
              print(f"::error::{len(trozos)} trozos pasan del cupo diario")
              sys.exit(1)

          def huella(t):
              return hashlib.sha256(
                  (os.environ["VOZ"] + "|" + direccion + "|" + t).encode()
              ).hexdigest()[:16]

          try:
              manif = json.load(open("trozos/manifiesto.json"))
          except Exception:
              manif = {}

          url = ("https://generativelanguage.googleapis.com/v1beta/models/"
                 f"{os.environ['MODELO']}:generateContent")

          def pedir(txt):
              cuerpo = {
                  "contents": [{"parts": [{"text":
                      f"{direccion}\n\nDi exactamente el texto que sigue, "
                      f"entero y sin resumir, y nada mas. No leas estas "
                      f"instrucciones.\n\n{txt}"}]}],
                  "generationConfig": {
                      "responseModalities": ["AUDIO"],
                      "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig":
                          {"voiceName": os.environ["VOZ"]}}},
                  },
              }
              pet = urllib.request.Request(
                  url, data=json.dumps(cuerpo).encode(),
                  headers={"Content-Type": "application/json",
                           "x-goog-api-key": os.environ["GOOGLE"]},
                  method="POST")
              for intento in range(1, 7):
                  try:
                      with urllib.request.urlopen(pet, timeout=600) as r:
                          return json.loads(r.read())
                  except urllib.error.HTTPError as e:
                      d = e.read().decode(errors="replace")
                      if e.code == 429 and re.search(r"limit: 0\b", d):
                          raise SystemExit(
                              f"::error::{os.environ['MODELO']} no esta en el "
                              f"plan gratuito (limit: 0)")
                      if e.code == 429 and re.search(r"PerDay|per day", d):
                          # No es un fallo del codigo: se guarda lo hecho y se
                          # reanuda tras el reinicio (medianoche del Pacifico).
                          raise SystemExit("CUOTA_DIARIA")
                      if e.code not in (429, 500, 503) or intento == 6:
                          raise SystemExit(
                              f"::error::Google devolvio {e.code}: {d[:400]}")
                      espera = 20.0 * intento
                      m = re.search(r"retry in ([\d.]+)s", d)
                      if m:
                          espera = float(m.group(1)) + 5
                      print(f"  {e.code}, espero {espera:.0f}s")
                      time.sleep(espera)

          def guardar(i, crudo, sr):
              w = f"trozos/{i:02d}.wav"
              with wave.open(w, "wb") as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(sr)
                  f.writeframes(crudo)
              # FLAC: sin perdida, la mitad de bytes en la rama. Volver a
              # codificar un mp3 en cada tanda degradaria el trozo.
              subprocess.run(["ffmpeg", "-y", "-v", "error", "-i", w,
                              f"trozos/{i:02d}.flac"], check=True)
              os.remove(w)

          def leer(i):
              b = subprocess.run(
                  ["ffmpeg", "-v", "error", "-i", f"trozos/{i:02d}.flac",
                   "-f", "s16le", "-ac", "1", "-ar", "24000", "-"],
                  check=True, stdout=subprocess.PIPE).stdout
              return b, 24000

          piezas, sr, pedidos, corte = [], 24000, 0, None
          for i, t in enumerate(trozos, 1):
              h = huella(t)
              if manif.get(str(i)) == h and os.path.exists(f"trozos/{i:02d}.flac"):
                  crudo, sr = leer(i)
                  print(f"trozo {i}/{len(trozos)}: reutilizado "
                        f"({len(crudo)/(sr*2):.1f}s)")
                  piezas.append(crudo)
                  continue
              if pedidos:
                  time.sleep(25)   # el plan gratuito da 3 por minuto
              print(f"trozo {i}/{len(trozos)}: pidiendo a Gemini")
              try:
                  resp = pedir(t)
              except SystemExit as e:
                  if str(e) == "CUOTA_DIARIA":
                      corte = i
                      break
                  raise
              pedidos += 1
              try:
                  parte = resp["candidates"][0]["content"]["parts"][0]["inlineData"]
              except (KeyError, IndexError):
                  print(f"::error::respuesta rara en el trozo {i}: "
                        f"{json.dumps(resp)[:400]}")
                  sys.exit(1)
              crudo = base64.b64decode(parte["data"])
              m = re.search(r"rate=(\d+)", parte.get("mimeType", ""))
              sr = int(m.group(1)) if m else 24000
              dur = len(crudo) / (sr * 2)
              esp = len(t.split()) / 2.8
              print(f"   {dur:.1f}s (esperaba ~{esp:.0f}s)")
              # Un trozo a menos de la mitad es texto comido, y pegado entre
              # otros cuatro no se nota al oido.
              if dur < esp * 0.5:
                  print(f"::error::trozo {i} truncado: {dur:.1f}s de ~{esp:.0f}s")
                  sys.exit(1)
              guardar(i, crudo, sr)
              manif[str(i)] = h
              json.dump(manif, open("trozos/manifiesto.json", "w"), indent=1)
              piezas.append(crudo)

          json.dump(manif, open("trozos/manifiesto.json", "w"), indent=1)
          if corte:
              print(f"::warning::cupo diario agotado en el trozo {corte} de "
                    f"{len(trozos)}. Los {corte-1} ya generados quedan "
                    f"guardados en la rama; al relanzar tras el reinicio "
                    f"(medianoche del Pacifico) solo se piden los que faltan.")
              sys.exit(1)

          def rms(b):
              a = array.array("h"); a.frombytes(b)
              return math.sqrt(sum(x * x for x in a) / len(a)) if a else 0.0

          def escalar(b, k):
              a = array.array("h"); a.frombytes(b)
              for i in range(len(a)):
                  a[i] = max(-32768, min(32767, int(a[i] * k)))
              return a.tobytes()

          # Igualar niveles al primer trozo: sin esto se oye un salto de
          # volumen en cada costura, peor que la degradacion original.
          base = rms(piezas[0]) or 1.0
          silencio = b"\x00\x00" * int(sr * 0.15)
          salida = b""
          for i, p in enumerate(piezas):
              k = base / (rms(p) or base)
              if i:
                  salida += silencio
              print(f"   trozo {i+1}: ganancia x{k:.2f}")
              salida += escalar(p, k) if abs(k - 1) > 0.02 else p

          with wave.open("salida/voz.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
              w.writeframes(salida)
          total = len(salida) / (sr * 2)
          esperado = float(os.environ["ESPERADO"])
          print(f"::notice::{len(trozos)} trozos, {total:.1f}s "
                f"({100 * total / esperado:.0f}% del patron de Azure); "
                f"{pedidos} peticiones gastadas")
          if total < esperado * 0.75:
              print(f"::error::solo {total:.1f}s de {esperado:.1f}s esperados")
              sys.exit(1)
          PY
          ffmpeg -y -v error -i salida/voz.wav -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
                 -c:a libmp3lame -b:a 256k "salida/${CLAVE}.mp3"
          rm -f salida/voz.wav
          ls -la salida/ trozos/

      - name: Guardar los trozos hechos
        # Corre aunque el paso anterior falle: si el cupo se agota a mitad,
        # lo ya generado tiene que llegar a la rama o se pierde.
        if: always()
        run: |
          mkdir -p "$DESTINO/trozos"
          cp -f trozos/*.flac "$DESTINO/trozos/" 2>/dev/null || true
          cp -f trozos/manifiesto.json "$DESTINO/trozos/" 2>/dev/null || true
          cp -f salida/*.mp3 "$DESTINO/" 2>/dev/null || true
          ls -la "$DESTINO" "$DESTINO/trozos" 2>/dev/null || true

      - uses: ./.github/actions/devolver
        with:
          destino: canal-youtube/muestras-voz/gemini-guion
          mensaje: Narracion completa con Gemini
