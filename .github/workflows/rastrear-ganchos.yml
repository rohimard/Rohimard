# Rastrea cómo empiezan los vídeos que revientan en el nicho.
#
# Nexlev y vidIQ se quedaron sin cuota, y desde el entorno de Claude YouTube
# está bloqueado. Un runner sí llega, así que el rastreo se hace aquí con
# yt-dlp y el resultado vuelve commiteado a la rama.
#
# Aviso: YouTube a veces corta a las IP de centros de datos. Si yt-dlp
# devuelve poco o nada, no es el script, es el bloqueo.
name: rastrear-ganchos

on:
  workflow_dispatch:
  push:
    branches:
      - claude/viral-youtube-video-ideas-luqj2m
    paths:
      - .github/workflows/rastrear-ganchos.yml
      - canal-youtube/rastrear-ganchos.py

permissions:
  contents: write

jobs:
  rastrear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet --upgrade yt-dlp

      - name: Buscar y extraer los ganchos
        run: python canal-youtube/rastrear-ganchos.py ganchos

      - name: Devolver el informe a la rama
        if: always()
        env:
          DESTINO: canal-youtube/investigacion
        run: |
          [ -f ganchos/ganchos.md ] || { echo "sin resultados"; exit 0; }
          mkdir -p "$DESTINO"
          cp ganchos/ganchos.md ganchos/ganchos.json "$DESTINO"/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f "$DESTINO"
          git commit -q -m 'Ganchos de los videos que revientan en el nicho' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && \
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
