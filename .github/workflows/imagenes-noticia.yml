# Baja las fotos reales que usaron los propios medios (NBC, KTLA, ABC7,
# TMZ, Today) para cubrir el choque de Chatsworth y la caida del
# helicoptero: la foto destacada (og:image) de cada articulo.
#
# Corre en GitHub Actions porque este sandbox tiene bloqueada la salida
# hacia la mayoria de estos dominios de noticias.
#
# Aviso, por si hace falta repetirlo: estas fotos son de los medios que las
# publicaron (NBC, Telemundo, agencias), no dominio publico ni licencia
# libre. El usuario pidio explicitamente maximo realismo aceptando ese
# riesgo, incluidas las fotos de las dos personas fallecidas.
name: imagenes-noticia

on:
  workflow_dispatch:
  push:
    branches:
      - claude/viral-youtube-video-ideas-luqj2m
    paths:
      - .github/workflows/imagenes-noticia.yml
      - canal-youtube/.imagenes-noticia-disparo

permissions:
  contents: write

env:
  DESTINO: canal-youtube/producciones/09-helicoptero-la/imagenes-noticia

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet beautifulsoup4 requests

      - name: Bajar la foto destacada de cada articulo
        run: |
          set -e
          mkdir -p "$DESTINO"
          python3 - <<'PY'
          import os
          import re
          import requests
          from bs4 import BeautifulSoup

          DESTINO = os.environ["DESTINO"]
          CABECERA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                     "AppleWebKit/537.36 (KHTML, like Gecko) "
                                     "Chrome/124.0 Safari/537.36"}

          objetivos = [
              ("moreno-marciniw-nbcnews.jpg",
               "https://www.nbcnews.com/news/us-news/nbcla-news-helicopter-crash-eliana-moreno-george-marciniw-tributes-rcna598071"),
              ("moreno-marciniw-today.jpg",
               "https://www.today.com/news/nbc-la-helicopter-crash-victims-eliana-moreno-george-marciniw-rcna598090"),
              ("rios-arresto-abc7.jpg",
               "https://abc7.com/story/chatsworth-bus-crash-woman-arrested-2-victims-idd-violent-involving-suv-slammed-metro/19839637/"),
              ("escena-helicoptero-cnn.jpg",
               "https://www.cnn.com/2026/09/15/us/helicopter-crash-los-angeles-hnk"),
              ("escena-helicoptero-mynewsla.jpg",
               "https://mynewsla.com/hollywood/2026/09/16/ntsb-leads-probe-into-deadly-newschopper4-crash-in-chatsworth/"),
              ("choque-autobus-pbs.jpg",
               "https://www.pbs.org/newshour/nation/3-people-killed-in-news-helicopter-crash-while-covering-la-bus-collision"),
              ("choque-autobus-hollywoodreporter.jpg",
               "https://www.hollywoodreporter.com/news/local-news/bus-accident-driver-arrested-murder-helicopter-crash-los-angeles-1236703952/"),
              ("helicoptero-n358tv-real.jpg",
               "https://www.planespotters.net/photos/reg/N358TV"),
              ("choque-bus-cbs.jpg",
               "https://www.cbsnews.com/losangeles/news/chatsworth-metro-bus-crash-nordhoff-street-los-angeles-fire-police/"),
              ("choque-bus-nbcla.jpg",
               "https://www.nbclosangeles.com/news/local/chatsworth-crash-involving-metro-bus/3942678/"),
              ("choque-bus-abc7-b.jpg",
               "https://abc7.com/story/least-2-dead-numerous-hurt-suv-slams-side-metro-bus-chatsworth/19837090/"),
              ("memorial-victimas-nbcla.jpg",
               "https://www.nbclosangeles.com/news/local/chatsworth-helicopter-bus-crash/3943072/"),
              ("heli-escena-foxla.jpg",
               "https://www.foxla.com/news/chatsworth-nbc-helicopter-crash"),
              ("bus-escena-foxla.jpg",
               "https://www.foxla.com/news/la-metro-bus-suv-get-horrific-crash-chatsworth"),
              ("heli-escena-abc7ny.jpg",
               "https://abc7ny.com/post/los-angeles-crash-helicopter-crashes-site-deadly-bus-collision-chatsworth-california/19837494/"),
              ("heli-escena-latintimes.jpg",
               "https://www.latintimes.com/tv-news-helicopter-covering-one-la-tragedy-became-second-one-tuesday-night-599279"),
              ("newsroom-evidencia-nbcla.jpg",
               "https://www.nbclosangeles.com/news/local/video-live-coverage-evidence-los-angeles-news-helicopter-crash/3943351/"),
              ("heli-escena-wgntv.jpg",
               "https://wgntv.com/news/los-angeles-news-helicopter-crash-what-we-know-about-victims-investigation/"),
              ("heli-escena-thenightly.jpg",
               "https://thenightly.com.au/world/la-helicopter-crash-eliana-moreno-george-marciniw-gutirrez-mejia-remembered-as-chopper-bursts-into-flames-c-22882379"),
              ("ntsb-investigador-abc7.jpg",
               "https://abc7.com/post/los-angeles-helicopter-crash-3rd-victim-identified-nbc4-crashes-chatsworth/19839630/"),
              ("heli-escena-sanfernandosun.jpg",
               "https://sanfernandosun.com/2026/09/16/ntsb-leads-probe-into-deadly-newschopper4-crash-in-chatsworth/"),
              ("bus-escena-abc10.jpg",
               "https://www.abc10.com/article/news/nation-world/fatal-helicopter-crash-reported-in-chatsworth-california/103-6b0058eb-f55d-4dd2-a8cf-4c6746ef42a6"),
              ("heli-escena-cbsla2.jpg",
               "https://www.cbsnews.com/losangeles/news/chatsworth-deadly-news-helicopter-crash-san-fernando-valley-los-angeles-fire/"),
              ("heli-escena-foxla-live.jpg",
               "https://www.foxla.com/news/deadly-la-news-helicopter-crash-investigatoin-begins"),
              ("heli-escena-abc7sf.jpg",
               "https://abc7news.com/story/los-angeles-helicopter-crash-3rd-victim-identified-nbc4-crashes-chatsworth/19839883/"),
              ("victimas-heli-cnn-perfil.jpg",
               "https://www.cnn.com/2026/09/17/us/la-helicopter-crash-victims"),
              ("victimas-bus-cbs.jpg",
               "https://www.cbsnews.com/losangeles/news/chatsworth-deadly-metro-bus-crash-victims-identified/"),
              ("helicoptero-n358tv-flightaware.jpg",
               "https://www.flightaware.com/photos/view/1485873-65c44cdffa168b5f2574eabfc594b5bda8c78888"),
              ("mourn-poynter.jpg",
               "https://www.poynter.org/commentary/2026/los-angeles-news-helicopter-crash-nbc4/"),
              ("heli-escena-abc7-c.jpg",
               "https://abc7.com/post/los-angeles-crash-helicopter-crashes-scene-deadly-bus-chatsworth/19837447/"),
              ("chapman-tributo-nbcla.jpg",
               "https://www.nbclosangeles.com/video/news/local/such-a-bright-light-chapman-university-remembers-alumna-eliana-moreno/3943596/"),
              ("estatuto-nbc4-telemundo.jpg",
               "https://www.nbclosangeles.com/news/local/nbc4-and-telemundo-52-statement-on-chatsworth-helicopter-crash/3942829/"),
          ]

          resumen = []
          for nombre, url in objetivos:
              try:
                  r = requests.get(url, headers=CABECERA, timeout=30)
                  r.raise_for_status()
                  sopa = BeautifulSoup(r.text, "html.parser")
                  etiqueta = (sopa.find("meta", property="og:image")
                              or sopa.find("meta", attrs={"name": "og:image"})
                              or sopa.find("meta", attrs={"name": "twitter:image"}))
                  imagen_url = etiqueta["content"] if etiqueta and etiqueta.get("content") else None
                  if not imagen_url:
                      resumen.append(f"SIN og:image: {nombre} <- {url}")
                      continue
                  ir = requests.get(imagen_url, headers=CABECERA, timeout=30)
                  ir.raise_for_status()
                  ruta = os.path.join(DESTINO, nombre)
                  with open(ruta, "wb") as f:
                      f.write(ir.content)
                  resumen.append(f"OK ({len(ir.content)} bytes): {nombre} <- {imagen_url}")
              except Exception as e:
                  resumen.append(f"FALLO: {nombre} <- {url} :: {e}")

          print("\n".join(resumen))
          with open(os.path.join(DESTINO, "FUENTES.txt"), "w") as f:
              f.write("\n".join(resumen) + "\n")
          PY
          ls -la "$DESTINO"
          file "$DESTINO"/*.jpg 2>/dev/null || true

      - name: Devolver las imagenes a la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f "$DESTINO"
          git commit -q -m 'Fotos de prensa de la noticia del helicoptero (con FUENTES.txt)' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && \
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
