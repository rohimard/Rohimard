# Narra el guión con Azure AI Speech, la voz Alonso.
#
# Es la misma voz que sacábamos por edge-tts, pero entrando por la puerta
# oficial: con clave, con términos aceptados y con derecho a publicar en un
# canal monetizado. La capa gratuita F0 da medio millón de caracteres al
# mes, unos cien vídeos.
#
# Corre aquí y no en local porque el entorno donde trabaja Claude tiene
# bloqueada la salida hacia Azure, y porque así la clave vive en los
# secretos del repo y no pasa por la conversación.
#
# Azure sintetiza hasta diez minutos de audio por petición y el guión entero
# son menos de cinco, así que va de una sola vez: segundos, no minutos.
name: voz-azure

on:
  workflow_dispatch:
  push:
    branches:
      - claude/viral-youtube-video-ideas-luqj2m
    paths:
      - .github/workflows/voz-azure.yml
      - canal-youtube/.azure-disparo

permissions:
  contents: write

env:
  GUION: canal-youtube/producciones/07-reina-victoria-duelo/guion-voz.txt
  DESTINO: canal-youtube/producciones/07-reina-victoria-duelo
  VOZ: es-US-AlonsoNeural
  ACABADO: highshelf=f=6500:g=2,deesser=i=0.25:m=0.5:f=0.55,equalizer=f=200:t=q:w=1.2:g=1.5,loudnorm=I=-16:TP=-1.5:LRA=11

jobs:
  narrar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Dos registros para elegir de oído. El de documental baja un poco el
      # tono y el ritmo, que es hacia donde tira la identidad del canal.
      matrix:
        include:
          - clave: alonso-natural
            rate: '0%'
            pitch: '0%'
          - clave: alonso-documental
            rate: '-6%'
            pitch: '-4%'
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la clave está puesta
        env:
          CLAVE: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::error::falta el secreto AZURE_SPEECH_KEY en el repo"
            exit 1
          fi

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Sintetizar con Azure
        env:
          CLAVE: ${{ secrets.AZURE_SPEECH_KEY }}
          REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          RATE: ${{ matrix.rate }}
          PITCH: ${{ matrix.pitch }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          from xml.sax.saxutils import escape

          texto = open(os.environ["GUION"], encoding="utf-8").read().strip()
          # Los párrafos del guión son las pausas largas del montaje.
          parrafos = "".join(
              f"<p>{escape(p.strip())}</p>"
              for p in texto.split("\n\n") if p.strip()
          )
          ssml = (
              "<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' "
              "xml:lang='es-MX'>"
              f"<voice name='{os.environ['VOZ']}'>"
              f"<prosody rate='{os.environ['RATE']}' pitch='{os.environ['PITCH']}'>"
              f"{parrafos}"
              "</prosody></voice></speak>"
          )

          region = (os.environ.get("REGION") or "eastus").strip()
          peticion = urllib.request.Request(
              f"https://{region}.tts.speech.microsoft.com/cognitiveservices/v1",
              data=ssml.encode("utf-8"),
              headers={
                  "Ocp-Apim-Subscription-Key": os.environ["CLAVE"],
                  "Content-Type": "application/ssml+xml",
                  "X-Microsoft-OutputFormat": "audio-24khz-160kbitrate-mono-mp3",
                  "User-Agent": "historia-incomoda",
              },
              method="POST",
          )
          with urllib.request.urlopen(peticion, timeout=180) as r:
              audio = r.read()
          open("crudo.mp3", "wb").write(audio)
          print(f"{len(texto)} caracteres -> {len(audio)/1024:.0f} KB")
          PY

      - name: Acabado
        run: |
          mkdir -p salida
          ffmpeg -y -v error -i crudo.mp3 -af "$ACABADO" \
                 -codec:a libmp3lame -qscale:a 2 "salida/${{ matrix.clave }}.mp3"
          echo "duración: $(ffprobe -v error -show_entries format=duration -of csv=p=0 "salida/${{ matrix.clave }}.mp3") s"

      - name: Devolver el audio a la rama
        env:
          CARPETA: canal-youtube/muestras-voz/azure
        run: |
          mkdir -p "$CARPETA" && mv salida/*.mp3 "$CARPETA"/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f "$CARPETA"
          git commit -q -m 'Narracion con Azure ${{ matrix.clave }}' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && \
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
