# Baja clips reales cortos (no solo capturas fijas) para el video 10
# (tendencia "Cat in the Hat"): los TikToks reales del propio hecho, en
# vez de solo la foto de la publicacion.
#
# Mismo motivo que el workflow de imagenes: este sandbox tiene bloqueada
# la salida hacia la mayoria de estos dominios, pero el runner de GitHub
# Actions no.
#
# Nada de video de los detenidos: todos son menores de edad. Ver
# canal-youtube/producciones/10-cat-in-the-hat/README.md.
name: videos-catinthehat

on:
  workflow_dispatch:
  push:
    branches:
      - claude/viral-youtube-video-ideas-luqj2m
    paths:
      - .github/workflows/videos-catinthehat.yml

permissions:
  contents: write

env:
  DESTINO: canal-youtube/producciones/10-cat-in-the-hat/videos

jobs:
  bajar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet -U yt-dlp

      - name: Bajar clips reales (TikTok del propio hecho)
        run: |
          set +e
          mkdir -p "$DESTINO"
          rm -f "$DESTINO/FUENTES-VIDEO.txt"
          yt-dlp --version

          bajar() {
            nombre="$1"; url="$2"
            echo "-- $nombre <- $url"
            # Tope de resolucion (no de calidad): 480p alcanza de sobra
            # para el fondo difuminado + primer plano del montaje, y
            # evita que el video mas largo (penguinz0, 9:20) se pase
            # del limite de tamano.
            salida=$(yt-dlp -f "bv*[height<=480]+ba/b[height<=480]/mp4" \
              --max-filesize 80M -o "$DESTINO/$nombre.mp4" "$url" 2>&1)
            echo "$salida"
            if [ -f "$DESTINO/$nombre.mp4" ]; then
              echo "OK: $nombre <- $url" >> "$DESTINO/FUENTES-VIDEO.txt"
            else
              # Guarda la ultima linea real del error (yt-dlp antepone
              # "ERROR:") para saber la causa exacta sin bajar el zip
              # de logs completo.
              motivo=$(echo "$salida" | grep -i "ERROR" | tail -1)
              echo "FALLO: $nombre <- $url :: ${motivo:-sin detalle}" >> "$DESTINO/FUENTES-VIDEO.txt"
            fi
          }

          # TikTok fallo: "Unexpected response from webpage request" es
          # un bug de yt-dlp contra el nuevo challenge/cookie de TikTok
          # (issues #17403/#17407/#17604, sin arreglo aun a la fecha),
          # no algo resoluble desde aqui.

          # Paginas de noticias con reproductor de video embebido.
          bajar cbc-kelowna-noticia "https://www.cbc.ca/news/canada/british-columbia/cat-in-the-hat-prank-west-kelowna-9.7337550"
          bajar globalnews-kelowna-noticia "https://globalnews.ca/news/12052365/cat-in-the-hat-chase-west-kelowna-rcmp/"
          bajar nbcct-westhaven-noticia "https://www.nbcconnecticut.com/news/local/west-haven-student-arrested-in-connection-with-cat-in-the-hat-school-threat/3774738/"

          # Los mismos segmentos de noticias, pero subidos a YouTube por
          # el propio canal de cada cadena -- yt-dlp es mucho mas
          # confiable en YouTube que contra el reproductor propio de
          # cada sitio de noticias (que a veces bloquea o no expone un
          # og:video). Encontrados via busqueda real (Nexlev), verificar
          # contenido real al bajarlos.
          bajar klfy-berwick-yt "https://www.youtube.com/watch?v=sHMwSvWyVwI"
          bajar wbrz-berwick-yt "https://www.youtube.com/watch?v=KXu58eXew0w"
          bajar fox61-westhaven-yt "https://www.youtube.com/watch?v=Ca0xf1oQhUE"
          bajar wtva-arresto-yt "https://www.youtube.com/watch?v=Ek6aswB5cqI"
          bajar wlwt-escuelas-yt "https://www.youtube.com/watch?v=MrcxsI4vlZA"
          bajar morecritical-kentucky-yt "https://www.youtube.com/watch?v=lTeF6l_7bXo"
          bajar morecritical-arrestos-yt "https://www.youtube.com/watch?v=xxgJQJZXUIk"
          bajar andysfilms-cierres-yt "https://www.youtube.com/watch?v=FHMiHH1kN_o"
          bajar pensacola-santarosa-yt "https://www.youtube.com/watch?v=8lKgXKs6-z4"
          bajar wjhl-tennessee-yt "https://www.youtube.com/watch?v=NSv2J7db3yI"
          bajar whio-ohio-yt "https://www.youtube.com/watch?v=lTqSWH-hzTc"
          bajar wfmj-ohio-yt "https://www.youtube.com/watch?v=-m2aiKwgU4I"
          bajar unsolvedminute-disfraz-yt "https://www.youtube.com/watch?v=WH4idzWOIJQ"
          bajar penguinz0-panico-yt "https://www.youtube.com/watch?v=t5Vba46KNpE"

          ls -la "$DESTINO"
          cat "$DESTINO/FUENTES-VIDEO.txt" 2>/dev/null || true

      - name: Devolver los videos a la rama
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f "$DESTINO"
          git commit -q -m 'Clips reales para el video de la tendencia Cat in the Hat' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && \
              git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
