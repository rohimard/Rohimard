{% extends "base.html" %}
{% block titulo %}{{ titulo }} · {{ marca }}{% endblock %}
{% block contenido %}
<section class="py-5">
  <div class="container text-center" style="max-width: 520px">
    <div class="display-4 fw-bold text-secondary">{{ codigo }}</div>
    <h1 class="h4 fw-bold mt-2">{{ titulo }}</h1>
    <p class="text-secondary">{{ mensaje }}</p>
    <a href="{{ url_for('inicio') }}" class="btn btn-dark mt-2">Volver al inicio</a>
  </div>
</section>
{% endblock %}
